<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask Smriti</title>
<style>
  :root {
    --teal-deep: #1f5f5b;
    --teal-mid: #2f8f89;
    --sand: #faf6ee;
    --clay: #c96a3e;
    --ink: #24322f;
    --line: #d8cfbd;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    background: var(--sand);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-size: 2rem;
    margin: 0 0 4px 0;
    color: var(--teal-deep);
  }

  .header p {
    margin: 0;
    font-size: 1.05rem;
    color: #5a6b66;
  }

  .mic-wrap {
    display: flex;
    justify-content: center;
    margin: 28px 0;
  }

  .mic-button {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: none;
    background: var(--teal-mid);
    color: white;
    font-size: 3rem;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--teal-deep);
    transition: transform 0.08s ease;
  }

  .mic-button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--teal-deep);
  }

  .mic-button.listening {
    background: var(--clay);
    box-shadow: 0 6px 0 #8f4526;
    animation: pulse 1.1s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(201, 106, 62, 0.45); }
    70%  { box-shadow: 0 0 0 22px rgba(201, 106, 62, 0); }
    100% { box-shadow: 0 0 0 0 rgba(201, 106, 62, 0); }
  }

  .wake-row {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
  }

  .wake-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1rem;
    color: var(--teal-deep);
    cursor: pointer;
  }

  .wake-toggle input {
    width: 20px;
    height: 20px;
    cursor: pointer;
  }

  .lang-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .lang-btn {
    font-size: 0.95rem;
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid var(--teal-mid);
    background: white;
    color: var(--teal-deep);
    cursor: pointer;
  }

  .lang-btn.active {
    background: var(--teal-mid);
    color: white;
  }

  .status {
    text-align: center;
    font-size: 1.1rem;
    min-height: 1.6em;
    color: var(--teal-deep);
    margin-bottom: 8px;
  }

  .transcript-box {
    background: white;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    min-height: 90px;
    font-size: 1.15rem;
    line-height: 1.5;
  }

  .transcript-box .you {
    color: #7a5b3a;
    font-weight: bold;
  }

  .transcript-box .smriti {
    color: var(--teal-deep);
    font-weight: bold;
  }

  .type-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .type-row input {
    flex: 1;
    font-size: 1.05rem;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
  }

  .type-row button {
    font-size: 1.05rem;
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--teal-deep);
    color: white;
    cursor: pointer;
  }

  .faq-hint {
    margin-top: 22px;
    font-size: 0.95rem;
    color: #6b6459;
    text-align: center;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🌿 Ask Smriti</h1>
    <p>Tap the microphone and ask a question</p>
  </div>

  <div class="mic-wrap">
    <button class="mic-button" id="micBtn">🎤</button>
  </div>

  <div class="wake-row">
    <label class="wake-toggle">
      <input type="checkbox" id="wakeToggle" />
      <span>Listen for "Hello Smriti"</span>
    </label>
  </div>

  <div class="lang-row">
    <button class="lang-btn active" id="langEnBtn" data-lang="en">English</button>
    <button class="lang-btn" id="langHiBtn" data-lang="hi">हिंदी</button>
  </div>

  <div class="status" id="status">Tap to speak</div>

  <div class="transcript-box" id="transcript">
    <em>Your conversation will appear here...</em>
  </div>

  <div class="type-row">
    <input type="text" id="typeInput" placeholder="Or type your question here" />
    <button id="typeBtn">Ask</button>
  </div>

  <div class="faq-hint">
    Switch language above, turn on the toggle and say "Hello Smriti" (or "स्मृति") to wake me up — or just tap the mic.
  </div>
</div>

<script>
/* =======================================================
   1. THE FAQ "DATABASE"
   This is the whole "brain" of Smriti. Each entry has:
   - keywords: words/phrases that should trigger this answer
   - answer: what Smriti should say back
   No AI model needed — just plain-text matching.
   ======================================================= */
const FAQ_EN = [
  {
    keywords: ["hi", "hello", "hey", "namaste"],
    answer: () => "Hello! How may I help you today?"
  },
  {
    keywords: ["how are you", "how are you doing"],
    answer: () => "I'm doing well, thank you for asking! How can I help you?"
  },
  {
    keywords: ["good morning"],
    answer: () => "Good morning! I hope you slept well. What can I do for you?"
  },
  {
    keywords: ["good night"],
    answer: () => "Good night! Sleep well, I'll be here in the morning."
  },
  {
    keywords: ["thank you", "thanks"],
    answer: () => "You're most welcome!"
  },
  {
    keywords: ["bye", "goodbye", "see you"],
    answer: () => "Goodbye! Take care, I'm always here if you need me."
  },
  {
    keywords: ["time", "clock", "what time"],
    answer: () => `It is currently ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}.`
  },
  {
    keywords: ["date", "today", "day is it"],
    answer: () => `Today is ${new Date().toLocaleDateString([], {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'})}.`
  },
  {
    keywords: ["where am i", "my location", "location", "lost"],
    answer: () => "I can show your current location on the map screen. Would you like me to open it?"
  },
  {
    keywords: ["memory game", "play game", "how do i play", "game rules"],
    answer: () => "To play the memory game, tap two cards to flip them. If they match, they stay open. Try to match all the pairs."
  },
  {
    keywords: ["scared", "afraid", "anxious", "worried", "confused"],
    answer: () => "It's okay, I'm right here with you. Take a slow breath. Would you like me to call a family member?"
  },
  {
    keywords: ["call family", "call my", "contact family", "sos", "help me"],
    answer: () => "Calling your family contact now. Stay where you are, help is on the way."
  },
  {
    keywords: ["who are you", "your name", "what are you"],
    answer: () => "I'm Smriti, your voice companion. I'm here to help you with games, reminders, and finding your way."
  }
];

// Hindi FAQ — keywords are written the way Chrome's Hindi speech
// recognizer actually transcribes speech: plain Devanagari text.
// (Keep both a couple of common phrasings per entry, since people
// phrase things differently.)
const FAQ_HI = [
  {
    keywords: ["नमस्ते", "हैलो", "हेलो"],
    answer: () => "नमस्ते! मैं आपकी कैसे मदद कर सकती हूं?"
  },
  {
    keywords: ["आप कैसे हैं", "कैसी हो"],
    answer: () => "मैं ठीक हूं, पूछने के लिए धन्यवाद! मैं आपकी क्या मदद कर सकती हूं?"
  },
  {
    keywords: ["सुप्रभात", "गुड मॉर्निंग"],
    answer: () => "सुप्रभात! उम्मीद है आप अच्छे से सोए। मैं आपकी क्या मदद कर सकती हूं?"
  },
  {
    keywords: ["शुभ रात्रि", "गुड नाइट"],
    answer: () => "शुभ रात्रि! अच्छी नींद लें, मैं सुबह यहीं रहूंगी।"
  },
  {
    keywords: ["धन्यवाद", "शुक्रिया"],
    answer: () => "आपका स्वागत है!"
  },
  {
    keywords: ["अलविदा", "बाय"],
    answer: () => "अलविदा! अपना ख्याल रखें, ज़रूरत पड़ने पर मैं यहीं हूं।"
  },
  {
    keywords: ["समय", "टाइम", "क्या समय हुआ"],
    answer: () => `अभी समय है ${new Date().toLocaleTimeString('hi-IN', {hour: '2-digit', minute:'2-digit'})}.`
  },
  {
    keywords: ["तारीख", "आज का दिन", "आज कौन सा दिन"],
    answer: () => `आज ${new Date().toLocaleDateString('hi-IN', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'})} है.`
  },
  {
    keywords: ["मैं कहां हूं", "मेरी लोकेशन", "जगह", "रास्ता भूल गया"],
    answer: () => "मैं आपकी वर्तमान लोकेशन नक्शे पर दिखा सकती हूं। क्या मैं उसे खोलूं?"
  },
  {
    keywords: ["मेमोरी गेम", "खेल कैसे खेलें", "गेम के नियम"],
    answer: () => "मेमोरी गेम खेलने के लिए दो कार्ड को पलटें। अगर वे मेल खाते हैं, तो वे खुले रहेंगे।"
  },
  {
    keywords: ["डर लग रहा है", "घबराहट", "परेशान", "उलझन"],
    answer: () => "कोई बात नहीं, मैं यहीं हूं आपके साथ। धीरे से सांस लें। क्या मैं परिवार के किसी सदस्य को बुलाऊं?"
  },
  {
    keywords: ["परिवार को बुलाओ", "परिवार से बात", "मदद करो", "एसओएस"],
    answer: () => "आपके परिवार के संपर्क को अभी कॉल कर रही हूं। वहीं रुकिए, मदद आ रही है।"
  },
  {
    keywords: ["तुम कौन हो", "तुम्हारा नाम", "आप कौन हैं"],
    answer: () => "मैं स्मृति हूं, आपकी वॉइस साथी। मैं खेल, याद दिलाने और रास्ता ढूंढने में आपकी मदद करती हूं।"
  }
];

// Fallback if nothing matches well enough
const FALLBACK_EN = "I'm not sure I understood that. You can ask me about the time, your location, the games, or say 'call family' for help.";
const FALLBACK_HI = "मुझे समझ नहीं आया। आप मुझसे समय, आपकी लोकेशन, खेल के बारे में पूछ सकते हैं, या मदद के लिए 'परिवार को बुलाओ' कहें।";

/* =======================================================
   2. KEYWORD MATCHING LOGIC
   Very simple on purpose: for each FAQ entry, count how many
   of its keywords appear inside what the user said.
   Whichever entry scores highest "wins". If the best score
   is 0, we use the fallback.
   ======================================================= */
function findAnswer(userText) {
  const text = userText.toLowerCase();
  const activeFaq = currentLang === "hi" ? FAQ_HI : FAQ_EN;

  let bestEntry = null;
  let bestScore = 0;

  for (const entry of activeFaq) {
    let score = 0;
    for (const kw of entry.keywords) {
      if (text.includes(kw.toLowerCase())) score += 1;
    }
    if (score > bestScore) {
      bestScore = score;
      bestEntry = entry;
    }
  }

  if (bestEntry) return bestEntry.answer();
  return currentLang === "hi" ? FALLBACK_HI : FALLBACK_EN;
}

/* =======================================================
   3. TEXT-TO-SPEECH (Smriti speaking back)
   ======================================================= */
function speak(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 0.9;   // slightly slower — easier for elderly users to follow
  utterance.pitch = 1;
  utterance.lang = currentLang === "hi" ? "hi-IN" : "en-IN";
  window.speechSynthesis.cancel(); // stop anything currently speaking
  window.speechSynthesis.speak(utterance);
}

/* =======================================================
   4. SPEECH-TO-TEXT (listening to the user)

   There are TWO recognizer objects doing two different jobs:

   - wakeRecognizer: runs continuously in the background,
     only listening for the phrase "hello smriti" (or "hey
     smriti"/"ok smriti"). It never triggers an FAQ answer
     by itself — it just "wakes up" the assistant.

   - commandRecognizer: a normal one-shot listener (like
     before). It starts either when the mic button is
     tapped, OR automatically right after the wake phrase
     is heard. Whatever it hears gets passed to findAnswer().
   ======================================================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById("micBtn");
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const wakeToggle = document.getElementById("wakeToggle");

const WAKE_PHRASES_EN = ["hello smriti", "hey smriti", "ok smriti", "okay smriti"];
const WAKE_PHRASES_HI = ["हेलो स्मृति", "नमस्ते स्मृति", "स्मृति"];

let currentLang = "en"; // "en" or "hi" — drives recognition lang, TTS voice, and which FAQ set is used
let commandRecognizer = null;
let wakeRecognizer = null;
let listening = false;      // true while commandRecognizer is capturing a question
let wakeModeOn = false;     // true while the "listen for wake word" toggle is on
let wakeShouldRestart = false; // guards against restart-after-intentional-stop races

if (SpeechRecognition) {
  /* ---- Command recognizer (one question at a time) ---- */
  commandRecognizer = new SpeechRecognition();
  commandRecognizer.lang = currentLang === "hi" ? "hi-IN" : "en-IN";
  commandRecognizer.continuous = false;
  commandRecognizer.interimResults = false;

  commandRecognizer.onstart = () => {
    listening = true;
    micBtn.classList.add("listening");
    statusEl.textContent = "Listening...";
  };

  commandRecognizer.onerror = (event) => {
    console.error("Command recognizer error:", event.error);
    statusEl.textContent = describeSpeechError(event.error);
    stopListeningUI();
  };

  commandRecognizer.onend = () => {
    stopListeningUI();
    // After answering, go back to passively listening for the wake word
    if (wakeModeOn) startWakeRecognizer();
  };

  commandRecognizer.onresult = (event) => {
    const said = event.results[0][0].transcript;
    handleUserInput(said);
  };

  /* ---- Wake-word recognizer (always listening in background) ---- */
  wakeRecognizer = new SpeechRecognition();
  wakeRecognizer.lang = currentLang === "hi" ? "hi-IN" : "en-IN";
  wakeRecognizer.continuous = true;      // keep listening indefinitely
  wakeRecognizer.interimResults = true;  // check partial results too, for a snappier reaction

  wakeRecognizer.onresult = (event) => {
    const phrases = currentLang === "hi" ? WAKE_PHRASES_HI : WAKE_PHRASES_EN;
    // Look through all results received since the last check
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const said = event.results[i][0].transcript.toLowerCase();
      if (phrases.some(phrase => said.includes(phrase.toLowerCase()))) {
        wakeRecognizer.stop(); // will trigger onend below, but we don't auto-restart this time
        wakeShouldRestart = false;
        speak(currentLang === "hi" ? "जी हां, मैं सुन रही हूं।" : "Yes, I'm listening.");
        // small delay so Smriti finishes speaking before mic reopens
        setTimeout(() => {
          if (commandRecognizer && !listening) commandRecognizer.start();
        }, 900);
        return;
      }
    }
  };

  wakeRecognizer.onerror = (event) => {
    console.error("Wake recognizer error:", event.error);
    // Common in continuous mode: it times out on silence. Just restart quietly.
    if (event.error !== "no-speech" && event.error !== "aborted") {
      statusEl.textContent = describeSpeechError(event.error);
    }
  };

  wakeRecognizer.onend = () => {
    // Browsers auto-stop continuous recognition after a while — restart it
    // as long as wake mode is still supposed to be on and we're not mid-command.
    if (wakeModeOn && wakeShouldRestart && !listening) {
      try { wakeRecognizer.start(); } catch (e) { /* already started, ignore */ }
    }
  };
} else {
  statusEl.textContent = "Speech recognition not supported in this browser. Use Chrome.";
  micBtn.disabled = true;
  wakeToggle.disabled = true;
}

// file:// pages can silently fail mic access in Chrome — warn early
if (location.protocol === "file:") {
  statusEl.textContent = "Warning: open this over http://localhost, not by double-clicking the file, or the mic may be blocked.";
}

function describeSpeechError(error) {
  if (error === "not-allowed" || error === "service-not-allowed") {
    return "Mic permission blocked. Click the lock/camera icon in the address bar and allow microphone.";
  }
  if (error === "no-speech") return "I didn't hear anything. Try again.";
  if (error === "audio-capture") return "No microphone found. Check your mic is connected.";
  if (error === "network") return "Network error — speech recognition needs an internet connection.";
  return "Error: " + error;
}

function startWakeRecognizer() {
  wakeShouldRestart = true;
  try { wakeRecognizer.start(); } catch (e) { /* already running, ignore */ }
  statusEl.textContent = currentLang === "hi" ? 'सक्रिय करने के लिए "स्मृति" कहें' : 'Say "Hello Smriti" to start';
}

function stopWakeRecognizer() {
  wakeShouldRestart = false;
  wakeRecognizer.stop();
  statusEl.textContent = currentLang === "hi" ? "टैप करके बोलें" : "Tap to speak";
}

function stopListeningUI() {
  listening = false;
  micBtn.classList.remove("listening");
  if (!wakeModeOn) statusEl.textContent = currentLang === "hi" ? "टैप करके बोलें" : "Tap to speak";
}

/* ---- Wire up the controls ---- */
micBtn.addEventListener("click", () => {
  if (!commandRecognizer) return;
  if (listening) {
    commandRecognizer.stop();
  } else {
    commandRecognizer.start();
  }
});

wakeToggle.addEventListener("change", () => {
  if (!wakeRecognizer) return;
  wakeModeOn = wakeToggle.checked;
  if (wakeModeOn) {
    startWakeRecognizer();
  } else {
    stopWakeRecognizer();
  }
});

/* ---- Language switch ---- */
const langButtons = document.querySelectorAll(".lang-btn");
langButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    const newLang = btn.dataset.lang; // "en" or "hi"
    if (newLang === currentLang) return;
    currentLang = newLang;

    langButtons.forEach(b => b.classList.toggle("active", b === btn));

    const bcp47 = currentLang === "hi" ? "hi-IN" : "en-IN";
    if (commandRecognizer) commandRecognizer.lang = bcp47;

    if (wakeRecognizer) {
      wakeRecognizer.lang = bcp47;
      // if it was listening, restart it so the new language takes effect
      if (wakeModeOn) {
        wakeShouldRestart = false;
        wakeRecognizer.stop();
        setTimeout(() => startWakeRecognizer(), 300);
      }
    }

    statusEl.textContent = currentLang === "hi" ? "टैप करके बोलें" : "Tap to speak";
  });
});

/* =======================================================
   5. TYPED INPUT (fallback / testing without a mic)
   ======================================================= */
document.getElementById("typeBtn").addEventListener("click", submitTyped);
document.getElementById("typeInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitTyped();
});

function submitTyped() {
  const input = document.getElementById("typeInput");
  const text = input.value.trim();
  if (!text) return;
  handleUserInput(text);
  input.value = "";
}

/* =======================================================
   6. TYING IT TOGETHER
   ======================================================= */
function handleUserInput(text) {
  const answer = findAnswer(text);
  appendToTranscript(text, answer);
  speak(answer);
}

function appendToTranscript(userText, smritiText) {
  if (transcriptEl.querySelector("em")) transcriptEl.innerHTML = "";
  transcriptEl.innerHTML += `<p><span class="you">You:</span> ${userText}</p>`;
  transcriptEl.innerHTML += `<p><span class="smriti">Smriti:</span> ${smritiText}</p>`;
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}
</script>

</body>
</html>
