<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask Smriti — Manova</title>
<style>
  :root {
    --navy: #17356e;
    --navy-d: #0f2550;
    --head: #17356e;
    --accent: #1f5fa8;
    --on-accent: #ffffff;
    --press: #144a85;
    --saffron: #ff9933;
    --green: #138808;
    --bg: #f3f5f9;
    --card: #ffffff;
    --soft: #eef3fb;
    --line: #c9d3e3;
    --ink: #1b2430;
    --muted: #4a5568;
    --danger: #b3261e;
    --listen: #c2410c;
    --you-bg: #fdf1e3;
    --bot-bg: #e8f4ea;
  }
  body.hc {
    --navy: #000000;
    --navy-d: #000000;
    --head: #ffd400;
    --accent: #ffd400;
    --on-accent: #000000;
    --press: #8a7300;
    --bg: #000000;
    --card: #000000;
    --soft: #111111;
    --line: #ffd400;
    --ink: #ffffff;
    --muted: #f0f0f0;
    --danger: #ff8a80;
    --listen: #ffd400;
    --you-bg: #111111;
    --bot-bg: #111111;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 17px; }
  body {
    font-family: "Segoe UI", "Noto Sans", "Noto Sans Devanagari", "Noto Sans Bengali", "Nirmala UI", Mukta, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  :focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip {
    position: absolute; left: -999px; top: 0; z-index: 99;
    background: #fff; color: var(--navy); padding: 10px 14px; font-weight: 700;
  }
  .skip:focus { left: 8px; top: 8px; }

  /* Tricolour strip */
  .tricolor { display: flex; height: 6px; }
  .tricolor i { flex: 1; display: block; }
  .tricolor i:nth-child(1) { background: #ff9933; }
  .tricolor i:nth-child(2) { background: #ffffff; border-top: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; }
  .tricolor i:nth-child(3) { background: #138808; }

  /* Utility bar */
  .utility { background: #eef1f6; border-bottom: 1px solid var(--line); color: #1b2430; }
  body.hc .utility { background: #000; color: #fff; }
  .util-in { display: flex; justify-content: flex-end; align-items: center; gap: 14px; flex-wrap: wrap; padding: 6px 16px; }
  .util-grp { display: flex; align-items: center; gap: 6px; }
  .u-label { font-size: 0.85rem; font-weight: 600; }
  .u-label::after { content: ":"; }
  .u-btn {
    min-height: 40px; min-width: 40px; padding: 2px 12px;
    border: 1px solid var(--navy); background: #fff; color: var(--navy);
    font-weight: 700; border-radius: 3px; cursor: pointer; font-size: 0.95rem;
  }
  body.hc .u-btn { border-color: #ffd400; background: #000; color: #ffd400; }
  .u-btn[aria-pressed="true"] { background: var(--navy); color: #fff; }
  body.hc .u-btn[aria-pressed="true"] { background: #ffd400; color: #000; }

  /* Header */
  .site-header { background: var(--navy); color: #fff; padding: 14px 0; border-bottom: 4px solid var(--saffron); }
  body.hc .site-header { border-bottom-color: #ffd400; }
  .head-in { display: flex; align-items: center; gap: 14px; }
  .logo svg { width: 54px; height: 54px; display: block; }
  .brand { font-size: 0.75rem; letter-spacing: 0.16em; color: #ffcf99; font-weight: 700; }
  body.hc .brand { color: #ffd400; }
  .site-header h1 { font-size: 1.6rem; line-height: 1.2; }
  .site-header p { font-size: 0.95rem; color: #dbe6f7; }
  body.hc .site-header p { color: #fff; }

  /* Breadcrumb */
  .crumbs { background: var(--card); border-bottom: 1px solid var(--line); font-size: 0.9rem; padding: 8px 0; }
  .crumbs a { color: var(--accent); font-weight: 600; }
  body.hc .crumbs a { color: #ffd400; }
  .crumbs .sep { margin: 0 6px; color: var(--muted); }

  /* Layout */
  main { padding-top: 18px; padding-bottom: 28px; flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; margin-bottom: 16px; }
  .card-title {
    font-size: 1.1rem; color: var(--head); line-height: 1.3;
    border-left: 5px solid var(--saffron); padding-left: 10px; margin-bottom: 4px;
  }
  .card-sub { font-size: 0.92rem; color: var(--muted); margin: 0 0 12px 15px; }
  .card-title + *:not(.card-sub) { margin-top: 10px; }
  @media (min-width: 900px) {
    .grid { display: grid; grid-template-columns: 5fr 7fr; gap: 18px; align-items: start; }
  }

  .perm-banner {
    display: none; background: #fff3e0; border: 1px solid #f0c78a; color: #7a4e12;
    border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; text-align: center;
  }
  .perm-banner.show { display: block; }

  /* Voice card */
  .status {
    background: var(--soft); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px; text-align: center; font-weight: 600; color: var(--head);
    min-height: 56px; display: flex; align-items: center; justify-content: center;
  }
  .status.listening { color: var(--listen); }
  .status.error { color: var(--danger); }
  .mic-wrap { display: flex; justify-content: center; padding: 18px 0 14px; }
  .mic {
    width: 132px; height: 132px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--on-accent); cursor: pointer;
    box-shadow: 0 7px 0 var(--press);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mic svg { width: 56px; height: 56px; }
  .mic:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--press); }
  .mic.on { background: var(--listen); color: #fff; animation: pulse 1.4s ease-out infinite; }
  body.hc .mic.on { color: #000; }
  .mic:disabled { opacity: 0.5; cursor: not-allowed; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(194, 65, 12, 0.5); }
    70% { box-shadow: 0 0 0 26px rgba(194, 65, 12, 0); }
    100% { box-shadow: 0 0 0 0 rgba(194, 65, 12, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
  .switch-row {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px;
    font-weight: 600; cursor: pointer; color: var(--head);
  }
  .switch-row input { width: 26px; height: 26px; accent-color: var(--accent); cursor: pointer; }
  .hint { font-size: 0.92rem; color: var(--muted); text-align: center; margin-top: 10px; }

  /* Language */
  .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lang-btn {
    min-height: 54px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
    border: 2px solid var(--accent); background: var(--card); color: var(--head); border-radius: 4px;
  }
  .lang-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* Conversation */
  .transcript {
    border: 1px solid var(--line); border-radius: 4px; padding: 12px;
    min-height: 200px; max-height: 360px; overflow-y: auto; background: var(--card);
  }
  .placeholder { color: var(--muted); font-style: italic; }
  .turn { margin-bottom: 14px; }
  .msg { padding: 8px 12px; border-radius: 4px; margin-bottom: 6px; font-size: 1.02rem; }
  .msg.you { background: var(--you-bg); border-left: 4px solid var(--saffron); }
  .msg.bot { background: var(--bot-bg); border-left: 4px solid var(--green); }
  body.hc .msg { border: 1px solid #ffd400; }
  .who { display: block; font-weight: 700; font-size: 0.82rem; margin-bottom: 2px; color: var(--head); text-transform: uppercase; letter-spacing: 0.04em; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .act-btn {
    display: inline-flex; align-items: center; min-height: 46px; padding: 0 16px;
    border-radius: 4px; text-decoration: none; font-weight: 700;
    background: var(--accent); color: var(--on-accent);
  }
  .act-btn.danger { background: var(--danger); color: #fff; }
  body.hc .act-btn.danger { color: #000; }
  .type-row { display: flex; gap: 10px; margin-top: 12px; }
  .type-row input {
    flex: 1; min-height: 50px; font-size: 1.05rem; padding: 0 14px;
    border: 2px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink);
  }
  .btn {
    min-height: 50px; padding: 0 22px; border: none; border-radius: 4px; cursor: pointer;
    background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 1.05rem;
  }

  /* Quick questions */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    min-height: 46px; padding: 0 16px; border: 1px solid var(--accent); background: var(--card);
    color: var(--head); border-radius: 24px; font-weight: 600; cursor: pointer; font-size: 1rem;
  }
  .chip:hover { background: var(--soft); }

  /* FAQ accordion */
  .faq-cat {
    font-size: 1rem; font-weight: 700; color: var(--head);
    margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--saffron);
  }
  details { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; background: var(--card); }
  summary {
    list-style: none; cursor: pointer; padding: 13px 14px 13px 40px;
    font-weight: 600; position: relative; min-height: 48px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "\25B8"; position: absolute; left: 14px; transition: transform 0.15s; }
  details[open] summary::before { transform: rotate(90deg); }
  details[open] summary { border-bottom: 1px solid var(--line); }
  .faq-body { padding: 12px 14px 14px 40px; }
  .faq-body p { margin-bottom: 10px; }
  .listen-btn {
    min-height: 44px; padding: 0 16px; border-radius: 4px; cursor: pointer;
    border: 2px solid var(--accent); background: var(--card); color: var(--head); font-weight: 700; font-size: 0.98rem;
    margin-right: 8px;
  }

  .back {
    display: block; text-align: center; padding: 16px; margin-top: 4px;
    background: var(--accent); color: var(--on-accent); font-weight: 700;
    border-radius: 4px; text-decoration: none; font-size: 1.1rem;
  }

  /* Footer */
  .site-footer { background: var(--navy); color: #fff; padding: 16px 0 18px; font-size: 0.9rem; border-top: 4px solid var(--saffron); }
  body.hc .site-footer { border-top-color: #ffd400; }
  .site-footer .emerg { font-weight: 700; color: #ffd9ae; margin-bottom: 6px; }
  body.hc .site-footer .emerg { color: #ffd400; }
  .site-footer .disc { color: #c9d7ee; font-size: 0.85rem; }
  body.hc .site-footer .disc { color: #fff; }
</style>
</head>

// Lower-case, fold look-alike letters, strip punctuation so keyword matching is forgiving.
function norm(s) {
  s = (s || "").normalize("NFC").toLowerCase();
  s = s.replace(/['’‘`´]/g, "");                    // apostrophes: can't -> cant
  s = s.replace(/[\u200c\u200d]/g, "");              // zero-width joiners
  s = s.replace(/ৰ/g, "র").replace(/ৱ/g, "ব");       // Assamese letters -> Bengali forms
  s = s.replace(/[\u0901\u0981]/g, "\u0902");        // chandrabindu -> anusvara (voice typing varies)
  s = s.replace(/[\u093c\u09bc]/g, "");              // drop nukta
  s = s.replace(/[^\p{L}\p{N}\p{M}\s]/gu, " ");      // punctuation (incl. danda) -> space
  return s.replace(/\s+/g, " ").trim();
}

// Precompute keywords from ALL languages, so a Hindi word typed in English mode (or a
// speech engine returning Bengali script for Assamese) still finds the right answer.
const KW = FAQS.map(e => ({
  e,
  ks: ["en", "hi", "as", "bn"].flatMap(l => e[l].k.map(norm)).filter(Boolean)
}));

function findEntry(text) {
  const t = norm(text);
  if (!t) return null;
  const padded = " " + t + " ", pre = " " + t;
  let best = null, bestScore = 0;
  for (const { e, ks } of KW) {
    let max = 0, hits = 0;
    for (const kw of ks) {
      const latin = /^[a-z0-9 ]+$/.test(kw);
      // Latin keywords must match whole words; Indic keywords match word starts (handles suffixes).
      const hit = latin ? padded.includes(" " + kw + " ") : pre.includes(" " + kw);
      if (!hit) continue;
      hits++;
      const s = kw.split(" ").length * 3 + (t === kw ? 10 : 0);
      if (s > max) max = s;
    }
    const total = max ? max + hits - 1 : 0;
    if (total > bestScore) { bestScore = total; best = e; }
  }
  return bestScore >= 3 ? best : null;
}

      const e = FAQS.find(x => x.id === id);
      const c = el("button", "chip", e[lang].q); c.type = "button";
      c.onclick = () => askEntry(e);
      box.appendChild(c);
    });
  }

  function renderFAQ() {
    const box = $("faqList"); box.textContent = "";
    CATS.forEach(cat => {
      const items = FAQS.filter(e => e.cat === cat);
      if (!items.length) return;
      box.appendChild(el("h3", "faq-cat", t("cats")[cat]));
      items.forEach(e => {
        const d = document.createElement("details");
        d.appendChild(el("summary", "", e[lang].q));
        const body = el("div", "faq-body");
        d.appendChild(body);
        d.addEventListener("toggle", () => {
          if (!d.open) return;
          body.textContent = "";
          const ans = fill(e[lang].a);
          body.appendChild(el("p", "", ans));
          const lb = el("button", "listen-btn", t("listen")); lb.type = "button";
          lb.onclick = () => speak(ans);
          body.appendChild(lb);
          addActions(body, e.act);
        });
        box.appendChild(d);
      });
    });
  }

  /* ---------- speech out ---------- */
  function pickVoice(cfg) {
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return undefined;                      // list not loaded: let browser choose
    for (const cand of cfg.voices) {
      const c = cand.toLowerCase();
      const list = vs.filter(v => {
        const l = v.lang.toLowerCase().replace("_", "-");
        return c.includes("-") ? l === c : l.split("-")[0] === c;
      });
      if (list.length) return list.find(v => FEMALE.test(v.name)) || list[0];
    }
    return null;                                           // none for this language
  }
  if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }

  function speak(text) {
    return new Promise(resolve => {
      if (!("speechSynthesis" in window)) return resolve(false);
      const v = pickVoice(LANGS[lang]);
      if (v === null) {
        if (!noVoiceShown[lang]) { noVoiceShown[lang] = true; setStatus("noVoice", "error"); }
        return resolve(false);
      }
      speechSynthesis.cancel();
      speaking = true; setStatus("speaking");
      const u = new SpeechSynthesisUtterance(text);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = LANGS[lang].stt; }
      u.rate = 0.88; u.pitch = 1.05;
      const done = () => { speaking = false; resolve(true); };
      u.onend = u.onerror = done;
      speechSynthesis.speak(u);
    });
  }

  /* ---------- speech in ---------- */
  async function ensureMic() {
    if (micOK) return true;
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach(tr => tr.stop());
      micOK = true; permBanner.classList.remove("show");
      return true;
    } catch (_) {
      permBanner.classList.add("show"); setStatus("allowMic", "error");
      return false;
    }
  }

  function stopUI() {
    listening = false;
    micBtn.classList.remove("on"); micBtn.setAttribute("aria-pressed", "false");
  }

  function initRecognizers() {
    if (!SR) {
      micBtn.disabled = true; wakeToggle.disabled = true; setStatus("useChrome", "error");
      return;
    }
    cmdRec = new SR();
    cmdRec.continuous = false; cmdRec.interimResults = false;
    cmdRec.onstart = () => {
      listening = true; errorShown = false;
      micBtn.classList.add("on"); micBtn.setAttribute("aria-pressed", "true");
      setStatus("listening", "listening");
    };
    cmdRec.onerror = e => {
      if (e.error === "aborted") return;
      errorShown = true;
      if (e.error === "language-not-supported") setStatus("langNoStt", "error");
      else if (e.error === "no-speech") setStatus("noSpeech", "error");
      else if (e.error === "not-allowed" || e.error === "service-not-allowed") { permBanner.classList.add("show"); setStatus("allowMic", "error"); }
      else setStatus("Error: " + e.error, "error");
    };
    cmdRec.onend = () => {
      stopUI();
      if (!errorShown && !speaking) setIdle();
      if (wakeOn && !speaking) setTimeout(startWake, 400);
    };
    cmdRec.onresult = e => {
      const said = e.results[0][0].transcript.trim();
      if (said) ask(said);
    };

    wakeRec = new SR();
    wakeRec.continuous = true; wakeRec.interimResults = true;
    wakeRec.onresult = e => {
      const phrases = LANGS[lang].wake.map(norm);
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const said = norm(e.results[i][0].transcript);
        if (phrases.some(p => said.includes(p))) {
          wakeRestart = false;
          try { wakeRec.stop(); } catch (_) {}
          speak(t("wakeAck")).then(() => setTimeout(() => { if (!listening) startCommand(); }, 300));
          return;
        }
      }
    };
    wakeRec.onerror = e => {
      if (e.error === "language-not-supported") {
        wakeOn = false; wakeRestart = false; wakeToggle.checked = false;
        setStatus("langNoStt", "error");
      }
    };
    wakeRec.onend = () => {
      if (wakeOn && wakeRestart && !listening && !speaking) setTimeout(() => { try { wakeRec.start(); } catch (_) {} }, 300);
    };
  }

  function startWake() {
    if (!wakeRec || !wakeOn) return;
    wakeRec.lang = LANGS[lang].stt;
    wakeRestart = true;
    try { wakeRec.start(); setStatus("wakeSay"); } catch (_) {}
  }
  function stopWake() {
    wakeRestart = false;
    try { wakeRec.stop(); } catch (_) {}
    setIdle();
  }

  async function startCommand() {
    if (listening || !cmdRec) return;
    if (!(await ensureMic())) return;
    if (wakeOn) { wakeRestart = false; try { wakeRec.stop(); } catch (_) {} }
    cmdRec.lang = LANGS[lang].stt;
    try { cmdRec.start(); } catch (_) { setStatus("retry", "error"); }
  }

  micBtn.onclick = () => {
    if (speaking) { speechSynthesis.cancel(); speaking = false; }
    if (listening) cmdRec.stop(); else startCommand();
  };
  wakeToggle.onchange = async () => {
    wakeOn = wakeToggle.checked;
    if (wakeOn) {
      if (!(await ensureMic())) { wakeToggle.checked = false; wakeOn = false; return; }
      startWake();
    } else stopWake();
  };
  $("typeForm").onsubmit = ev => {
    ev.preventDefault();
    const inp = $("typeInput"), v = inp.value.trim();
    if (v) { ask(v); inp.value = ""; }
  };

  /* ---------- start ---------- */
  applyFont();
  applyContrast(store.get("smriti_hc", "0") === "1");
  renderLangButtons();
  initRecognizers();
  applyUI();
})();
</script>
</body>
</html>
