<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Detective</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 850px;
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

h1 {
    text-align: center;
    color: #4b3f72;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.hidden {
    display: none;
}

/* HOME */

.selection {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 20px 0;
}

.selection button {
    padding: 12px 25px;
    border: 2px solid #667eea;
    background: white;
    color: #4b3f72;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
}

.selection button.selected {
    background: #667eea;
    color: white;
}

.start-btn,
.next-btn,
.restart-btn {
    display: block;
    margin: 25px auto 0;
    padding: 14px 35px;
    border: none;
    border-radius: 12px;
    background: #667eea;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.start-btn:hover,
.next-btn:hover,
.restart-btn:hover {
    opacity: 0.85;
}

/* GAME */

.top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-weight: bold;
    color: #4b3f72;
}

.progress-container {
    height: 10px;
    background: #eee;
    border-radius: 10px;
    margin-bottom: 25px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #667eea;
    border-radius: 10px;
}

.story-box {
    background: #f5f5ff;
    padding: 25px;
    border-radius: 18px;
    line-height: 1.7;
    font-size: 18px;
    margin-bottom: 20px;
}

.story-title {
    color: #4b3f72;
    margin-bottom: 12px;
}

.question-box {
    margin-top: 20px;
}

.question {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 18px;
}

.options {
    display: grid;
    gap: 12px;
}

.option {
    padding: 15px;
    border: 2px solid #ddd;
    background: white;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
}

.option:hover {
    background: #f1f1ff;
}

.option.correct {
    background: #c8f7c5;
    border-color: green;
}

.option.wrong {
    background: #ffd0d0;
    border-color: red;
}

.feedback {
    margin-top: 15px;
    font-weight: bold;
    min-height: 25px;
}

/* RESULT */

.result {
    text-align: center;
}

.result h2 {
    color: #4b3f72;
    margin-bottom: 15px;
}

.score {
    font-size: 45px;
    font-weight: bold;
    color: #667eea;
    margin: 20px;
}

.badge {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 20px;
    background: #eee;
    margin-top: 10px;
}

@media(max-width:600px) {
    .game {
        padding: 20px;
    }

    .story-box {
        font-size: 16px;
    }

    .question {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="game">

    <!-- HOME SCREEN -->

    <div id="homeScreen">

        <h1>🕵️ Story Detective</h1>

        <p class="subtitle">
            Read the story carefully and test your memory!
        </p>

        <h3>Select Language</h3>

        <div class="selection">
            <button id="englishBtn" onclick="selectLanguage('english')">
                English
            </button>

            <button id="hindiBtn" onclick="selectLanguage('hindi')">
                हिंदी
            </button>
        </div>

        <h3>Select Difficulty</h3>

        <div class="selection">

            <button onclick="selectDifficulty('easy')" id="easyBtn">
                Easy
            </button>

            <button onclick="selectDifficulty('medium')" id="mediumBtn">
                Medium
            </button>

            <button onclick="selectDifficulty('hard')" id="hardBtn">
                Hard
            </button>

        </div>

        <button class="start-btn" onclick="startGame()">
            🚀 Start Game
        </button>

    </div>


    <!-- GAME SCREEN -->

    <div id="gameScreen" class="hidden">

        <div class="top-bar">

            <span id="levelText">
                Level 1
            </span>

            <span id="timer">
                ⏱️ 30
            </span>

            <span id="scoreText">
                ⭐ Score: 0
            </span>

        </div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <div class="story-box">

            <h2 class="story-title" id="storyTitle">
                Story
            </h2>

            <p id="storyText"></p>

        </div>

        <div class="question-box">

            <p class="question" id="questionText"></p>

            <div class="options" id="options"></div>

            <p class="feedback" id="feedback"></p>

        </div>

        <button
            class="next-btn hidden"
            id="nextBtn"
            onclick="nextQuestion()">
            Next Question →
        </button>

    </div>


    <!-- RESULT SCREEN -->

    <div id="resultScreen" class="hidden result">

        <h1>🎉 Game Complete!</h1>

        <h2>Your Final Score</h2>

        <div class="score" id="finalScore">
            0
        </div>

        <p id="resultMessage"></p>

        <div class="badge" id="badge">
            🧠 Story Detective
        </div>

        <button class="restart-btn" onclick="restartGame()">
            🔄 Play Again
        </button>

    </div>

</div>


<script>

let language = "english";
let difficulty = "easy";

let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 30;

const questions = {

    easy: {

        english: [

            {
                storyTitle: "The Lost Puppy",

                story:
                "Riya was walking in the park when she saw a small brown puppy. The puppy was sitting near a tree. Riya gave it some water and called the animal shelter. Soon, the puppy was taken safely to the shelter.",

                question:
                "What color was the puppy?",

                options: [
                    "Black",
                    "Brown",
                    "White",
                    "Grey"
                ],

                answer: 1
            },

            {
                storyTitle: "A Rainy Morning",

                story:
                "Arjun woke up early on Sunday morning. It was raining outside, so he decided to stay home. He made a cup of hot chocolate and read his favorite book.",

                question:
                "What did Arjun drink?",

                options: [
                    "Tea",
                    "Coffee",
                    "Juice",
                    "Hot chocolate"
                ],

                answer: 3
            },

            {
                storyTitle: "The School Garden",

                story:
                "Meena and her friends planted flowers in the school garden. They planted roses, sunflowers and lilies. After planting the flowers, they watered them carefully.",

                question:
                "Where did Meena plant the flowers?",

                options: [
                    "At home",
                    "In the school garden",
                    "In a park",
                    "Near a river"
                ],

                answer: 1
            }

        ],

        hindi: [

            {
                storyTitle: "खोया हुआ पिल्ला",

                story:
                "रिया पार्क में घूम रही थी। उसने एक छोटा भूरा पिल्ला देखा। पिल्ला एक पेड़ के पास बैठा था। रिया ने उसे पानी दिया और पशु आश्रय केंद्र को फोन किया।",

                question:
                "पिल्ले का रंग क्या था?",

                options: [
                    "काला",
                    "भूरा",
                    "सफेद",
                    "ग्रे"
                ],

                answer: 1
            },

            {
                storyTitle: "बारिश की सुबह",

                story:
                "अर्जुन रविवार की सुबह जल्दी उठा। बाहर बारिश हो रही थी, इसलिए उसने घर पर रहने का फैसला किया। उसने गर्म चॉकलेट बनाई और अपनी पसंदीदा किताब पढ़ी।",

                question:
                "अर्जुन ने क्या पिया?",

                options: [
                    "चाय",
                    "कॉफी",
                    "जूस",
                    "गर्म चॉकलेट"

                answer: 3

                storyTitle: "स्कूल का बगीचा",

                story:
                "मीना और उसके दोस्तों ने स्कूल के बगीचे में फूल लगाए। उन्होंने गुलाब, सूरजमुखी और लिली लगाए। फूल लगाने के बाद उन्होंने उन्हें पानी दिया।",

                question:
                "मीना ने फूल कहाँ लगाए?",

                options: [
                    "घर पर",
                    "स्कूल के बगीचे में",
                    "पार्क में",
                    "नदी के पास"
                ],

                answer: 1
            }

        ]

    },


    medium: {

        english: [

            {
                storyTitle: "The Science Exhibition",

                story:
                "Kabir was preparing for his school science exhibition. He built a small model of a wind turbine using cardboard and a motor. His friend Sara helped him paint the model blue. On exhibition day, their project received many compliments from the visitors.",

                question:
                "Who helped Kabir paint the model?",

                options: [
                    "Riya",
                    "Sara",
                    "Anita",
                    "Rahul"
                ],

                answer: 1
            },

            {
                storyTitle: "The Train Journey",

                story:
                "Neha travelled to Jaipur with her family by train. They left Delhi early in the morning. During the journey, Neha watched the fields outside the window and played cards with her brother. They reached Jaipur in the afternoon.",

                question:
                "How did Neha travel to Jaipur?",

                options: [
                    "By bus",
                    "By car",
                    "By train",
                    "By plane"
                ],

                answer: 2
            },

            {
                storyTitle: "The Library Book",

                story:
                "Aman borrowed a book about space from the school library. The book explained planets, stars and galaxies. Aman was especially interested in Mars. He returned the book after one week and borrowed another book about rockets.",

                question:
                "Which planet interested Aman the most?",

                options: [
                    "Earth",
                    "Mars",
                    "Venus",
                    "Jupiter"
                ],

                answer: 1
            }

        ],

        hindi: [

            {
                storyTitle: "विज्ञान प्रदर्शनी",

                story:
                "कबीर अपने स्कूल की विज्ञान प्रदर्शनी के लिए तैयारी कर रहा था। उसने कार्डबोर्ड और मोटर से पवन टरबाइन का मॉडल बनाया। उसकी दोस्त सारा ने मॉडल को नीले रंग से रंगने में उसकी मदद की।",

                question:
                "मॉडल को रंगने में कबीर की मदद किसने की?",

                options: [
                    "रिया",
                    "सारा",
                    "अनिता",
                    "राहुल"
                ],

                answer: 1
            },

            {
                storyTitle: "ट्रेन की यात्रा",

                story:
                "नेहा अपने परिवार के साथ ट्रेन से जयपुर गई। वे सुबह जल्दी दिल्ली से निकले। यात्रा के दौरान नेहा खिड़की से बाहर खेत देखती रही और अपने भाई के साथ ताश खेलती रही।",

                question:
                "नेहा जयपुर कैसे गई?",

                options: [
                    "बस से",
                    "कार से",
                    "ट्रेन से",
                    "हवाई जहाज से"
                ],

                answer: 2
            },

            {
                storyTitle: "पुस्तकालय की किताब",

                story:
                "अमन ने स्कूल की लाइब्रेरी से अंतरिक्ष के बारे में एक किताब ली। किताब में ग्रहों, तारों और आकाशगंगाओं के बारे में बताया गया था। अमन को मंगल ग्रह में सबसे ज्यादा रुचि थी।",

                question:
                "अमन को किस ग्रह में सबसे ज्यादा रुचि थी?",

                options: [
                    "पृथ्वी",
                    "मंगल",
                    "शुक्र",
                    "बृहस्पति"
                ],

                answer: 1
            }

        ]

    },


    hard: {

        english: [

            {
                storyTitle: "The Museum Mystery",

                story:
                "During a school trip, three students visited a history museum. Ananya was interested in ancient coins, Vikram studied old maps, and Zoya spent most of her time looking at paintings. Before leaving, their teacher asked everyone to remember the location of the main entrance because the group would meet there later.",

                question:
                "What was Vikram interested in?",

                options: [
                    "Ancient coins",
                    "Paintings",
                    "Old maps",
                    "Sculptures"
                ],

                answer: 2
            },

            {
                storyTitle: "The Community Project",

                story:
                "Four students decided to organize a community project. Rahul collected books, Priya designed posters, Sameer arranged transportation, and Nisha contacted volunteers. Their goal was to donate educational materials to children in a nearby village. The project was completed successfully after two weeks.",

                question:
                "Who designed the posters?",

                options: [
                    "Rahul",
                    "Priya",
                    "Sameer",
                    "Nisha"
                ],

                answer: 1
            },

            {
                storyTitle: "The Mountain Trip",

                story:
                "During a mountain trip, Aarav carried a blue backpack containing food and water. His sister Mira carried a red backpack with a first-aid kit. Their guide carried a map and a flashlight. After reaching the campsite, they placed their bags inside the tent before exploring the area.",

                question:
                "What was inside Mira's backpack?",

                options: [
                    "Food and water",
                    "A map",
                    "A flashlight",
                    "A first-aid kit"
                ],

                answer: 3
            }

        ],

        hindi: [

            {
                storyTitle: "संग्रहालय का रहस्य",

                story:
                "स्कूल की यात्रा के दौरान तीन विद्यार्थियों ने इतिहास संग्रहालय देखा। अनन्या को प्राचीन सिक्कों में रुचि थी, विक्रम पुराने नक्शों को देख रहा था और ज़ोया चित्रों को देख रही थी। जाने से पहले शिक्षक ने सभी को मुख्य प्रवेश द्वार की जगह याद रखने को कहा।",

                question:
                "विक्रम को किस चीज़ में रुचि थी?",

                options: [
                    "प्राचीन सिक्के",
                    "चित्र",
                    "पुराने नक्शे",
                    "मूर्तियाँ"
                ],

                answer: 2
            },

            {
                storyTitle: "सामुदायिक परियोजना",

                story:
                "चार विद्यार्थियों ने एक सामुदायिक परियोजना शुरू की। राहुल ने किताबें इकट्ठी कीं, प्रिया ने पोस्टर बनाए, समीर ने परिवहन की व्यवस्था की और निशा ने स्वयंसेवकों से संपर्क किया। उनका लक्ष्य पास के गाँव के बच्चों को शैक्षणिक सामग्री देना था।",

                question:
                "पोस्टर किसने बनाए?",

                options: [
                    "राहुल",
                    "प्रिया",
                    "समीर",
                    "निशा"
                ],

                answer: 1
            },

            {
                storyTitle: "पहाड़ की यात्रा",

                story:
                "पहाड़ की यात्रा के दौरान आरव ने एक नीला बैग रखा जिसमें खाना और पानी था। उसकी बहन मीरा के लाल बैग में प्राथमिक उपचार की किट थी। उनके गाइड के पास नक्शा और टॉर्च थी। कैंप पहुँचने के बाद उन्होंने अपने बैग तंबू के अंदर रख दिए।",

                question:
                "मीरा के बैग में क्या था?",

                options: [
                    "खाना और पानी",
                    "नक्शा",
                    "टॉर्च",
                    "प्राथमिक उपचार की किट"
                ],

                answer: 3
            }

        ]

    }

};


function selectLanguage(lang) {

    language = lang;

    document.getElementById("englishBtn")
        .classList.remove("selected");

    document.getElementById("hindiBtn")
        .classList.remove("selected");

    if (lang === "english") {

        document.getElementById("englishBtn")
            .classList.add("selected");

    } else {

        document.getElementById("hindiBtn")
            .classList.add("selected");

    }
}


function selectDifficulty(level) {

    difficulty = level;

    document.getElementById("easyBtn")
        .classList.remove("selected");

    document.getElementById("mediumBtn")
        .classList.remove("selected");

    document.getElementById("hardBtn")
        .classList.remove("selected");

    document.getElementById(level + "Btn")
        .classList.add("selected");
}


function startGame() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("homeScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    showQuestion();

}


function showQuestion() {

    clearInterval(timer);

    timeLeft = difficulty === "easy"
        ? 30
        : difficulty === "medium"
        ? 25
        : 20;

    document.getElementById("timer")
        .innerText = "⏱️ " + timeLeft;

    timer = setInterval(() => {

        timeLeft--;

        document.getElementById("timer")
            .innerText = "⏱️ " + timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            lockOptions();

            document.getElementById("feedback")
                .innerText = "⏰ Time's up!";

            document.getElementById("nextBtn")
                .classList.remove("hidden");

        }

    }, 1000);


    const data =
        questions[difficulty][language][currentQuestion];

    document.getElementById("levelText")
        .innerText =
        "Level " +
        (currentQuestion + 1) +
        " / 3";


    document.getElementById("scoreText")
        .innerText =
        "⭐ Score: " + score;


    document.getElementById("storyTitle")
        .innerText =
        "📖 " + data.storyTitle;


    document.getElementById("storyText")
        .innerText =
        data.story;


    document.getElementById("questionText")
        .innerText =
        data.question;


    const options =
        document.getElementById("options");

    options.innerHTML = "";


    data.options.forEach((option, index) => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.innerText =
            option;

        button.onclick =
            () => checkAnswer(index, button);

        options.appendChild(button);

    });


    document.getElementById("feedback")
        .innerText = "";


    document.getElementById("nextBtn")
        .classList.add("hidden");


    document.getElementById("progress")
        .style.width =
        ((currentQuestion) / 3 * 100) + "%";

}


function checkAnswer(selected, button) {

    clearInterval(timer);

    const data =
        questions[difficulty][language][currentQuestion];

    lockOptions();

    if (selected === data.answer) {

        button.classList.add("correct");

        document.getElementById("feedback")
            .innerText =
            "✅ Correct! Great memory!";

        score +=
            difficulty === "easy"
            ? 10
            : difficulty === "medium"
            ? 20
            : 30;

    } else {

        button.classList.add("wrong");

        document.getElementById("feedback")
            .innerText =
            "❌ Incorrect. Keep trying!";

    }

    document.getElementById("scoreText")
        .innerText =
        "⭐ Score: " + score;

    document.getElementById("nextBtn")
        .classList.remove("hidden");

}


function lockOptions() {

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(button => {

        button.disabled = true;

        button.style.cursor = "default";

    });

}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= 3) {

        showResult();

    } else {

        showQuestion();

    }

}


function showResult() {

    clearInterval(timer);

    document.getElementById("gameScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");

    document.getElementById("finalScore")
        .innerText =
        score;


    let message = "";

    if (score >= 80) {

        message =
            "🌟 Excellent! You have amazing memory and attention skills.";

    } else if (score >= 50) {

        message =
            "👏 Great job! Keep practicing to improve your memory.";

    } else {

        message =
            "💪 Good attempt! Try again and beat your score.";

    }

    document.getElementById("resultMessage")
        .innerText =
        message;

}


function restartGame() {

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("homeScreen")
        .classList.remove("hidden");

}

</script>

</body>
</html>
