<title>Story Detective</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.game {
    width: 100%;
    max-width: 850px;

    background: white;

    border-radius: 25px;

    padding: 30px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);
}

h1 {
    text-align: center;
    color: #4b3f72;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.hidden {
    display: none;
}


/* HOME */

.selection {
    display: flex;
    gap: 15px;

    justify-content: center;

    flex-wrap: wrap;

    margin: 20px 0;
}

.selection button {

    padding: 12px 25px;

    border: 2px solid #667eea;

    background: white;

    color: #4b3f72;

    border-radius: 12px;

    cursor: pointer;

    font-size: 16px;
}

.selection button.selected {

    background: #667eea;

    color: white;
}

.start-btn,
.next-btn,
.restart-btn {

    display: block;

    margin: 25px auto 0;

    padding: 14px 35px;

    border: none;

    border-radius: 12px;

    background: #667eea;

    color: white;

    font-size: 17px;

    cursor: pointer;
}

.start-btn:hover,
.next-btn:hover,
.restart-btn:hover {

    opacity: 0.85;
}


/* GAME */

.top-bar {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 20px;

    font-weight: bold;

    color: #4b3f72;

    flex-wrap: wrap;
}

.difficulty-display {

    text-align: center;

    margin-bottom: 15px;

    color: #667eea;

    font-weight: bold;

    font-size: 17px;
}

.progress-container {

    height: 10px;

    background: #eee;

    border-radius: 10px;

    margin-bottom: 25px;
}

.progress {

    height: 100%;

    width: 0%;

    background: #667eea;

    border-radius: 10px;

    transition: width 0.3s;
}

.story-box {

    background: #f5f5ff;

    padding: 25px;

    border-radius: 18px;

    line-height: 1.7;

    font-size: 18px;

    margin-bottom: 20px;
}

.story-title {

    color: #4b3f72;

    margin-bottom: 12px;
}

.question-box {

    margin-top: 20px;
}

.question {

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 18px;
}

.options {

    display: grid;

    gap: 12px;
}

.option {

    padding: 15px;

    border: 2px solid #ddd;

    background: white;

    border-radius: 12px;

    cursor: pointer;

    text-align: left;

    font-size: 16px;
}

.option:hover {

    background: #f1f1ff;
}

.option.correct {

    background: #c8f7c5;

    border-color: green;
}

.option.wrong {

    background: #ffd0d0;

    border-color: red;
}

.feedback {

    margin-top: 15px;

    font-weight: bold;

    min-height: 25px;
}


/* RESULT */

.result {

    text-align: center;
}

.result h2 {

    color: #4b3f72;

    margin-bottom: 15px;
}

.score {

    font-size: 45px;

    font-weight: bold;

    color: #667eea;

    margin: 20px;
}

.badge {

    display: inline-block;

    padding: 10px 20px;

    border-radius: 20px;

    background: #eee;

    margin-top: 10px;
}


@media(max-width:600px) {

    .game {

        padding: 20px;
    }

    .story-box {

        font-size: 16px;
    }

    .question {

        font-size: 18px;
    }

    .top-bar {

        justify-content: center;
    }
}

</style>
</head>

<div class="game">


    <!-- HOME SCREEN -->

    <div id="homeScreen">

                हिंदी

            </button>

        </div>


        <p style="text-align:center; color:#666; margin-top:20px;">
            🧠 Difficulty will automatically adapt according to your answers.
        </p>


        <button
            class="start-btn"
            onclick="startGame()">

            🚀 Start Game

        </button>

    </div>



    <!-- GAME SCREEN -->

    <div id="gameScreen" class="hidden">


        <div class="top-bar">

            <span id="storyNumber">
                📖 Story 1 / 3
            </span>

            <span id="questionNumber">

        <div class="question-box">

            <div

            <p

        </div>


        <button
            class="next-btn hidden"

    </div>



    <!-- RESULT SCREEN -->

    <div
        id="resultScreen"
        class="hidden result">

        <h1>🎉 Game Complete!</h1>

        <h2>Your Final Score</h2>


        <div
            class="score"
            id="finalScore">

            0

        </div>


        <p id="resultMessage"></p>


        <div
            class="badge"
            id="badge">

            🧠 Story Detective

        </div>


        <button
            class="restart-btn"
            onclick="restartGame()">

            🔄 Play Again

    </div>

</div>

/* =========================
   LANGUAGE
========================= */

function selectLanguage(lang) {

    language = lang;

    document
        .getElementById("englishBtn")
        .classList.remove("selected");

    document
        .getElementById("hindiBtn")
        .classList.remove("selected");


    if (lang === "english") {

        document
            .getElementById("englishBtn")
            .classList.add("selected");

    } else {

        document
            .getElementById("hindiBtn")
            .classList.add("selected");

    }

}



/* =========================
   START GAME
========================= */

function startGame() {

    currentStory = 0;

    currentQuestion = 0;

    score = 0;

    /*
    Every new game starts at Easy.
    */

    difficultyLevel = 0;


    document
        .getElementById("homeScreen")
        .classList.add("hidden");


    document
        .getElementById("resultScreen")
        .classList.add("hidden");


    document
        .getElementById("gameScreen")
        .classList.remove("hidden");


    showQuestion();

}



/* =========================
   GET DIFFICULTY NAME
========================= */

function getDifficultyName() {

    if (difficultyLevel === 0) {

        return "Easy";

    }

    if (difficultyLevel === 1) {

        return "Medium";

    }

    return "Hard";

}



/* =========================
   GET DIFFICULTY EMOJI
========================= */

function getDifficultyEmoji() {

    if (difficultyLevel === 0) {

        return "🟢";

    }

    if (difficultyLevel === 1) {

        return "🟡";

    }

    return "🔴";

}



/* =========================
   TIMER
========================= */

function getTime() {

    if (difficultyLevel === 0) {

        return 30;

    }

    if (difficultyLevel === 1) {

        return 25;

    }

    return 20;

}



/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

    clearInterval(timer);


    timeLeft = getTime();


    document
        .getElementById("timer")
        .innerText =
        "⏱️ " + timeLeft;


    timer = setInterval(() => {

        timeLeft--;

        document
            .getElementById("timer")
            .innerText =
            "⏱️ " + timeLeft;


        if (timeLeft <= 0) {

            clearInterval(timer);

            lockOptions();


            document
                .getElementById("feedback")
                .innerText =
                "⏰ Time's up!";


            document
                .getElementById("nextBtn")
                .classList.remove("hidden");

        }

    }, 1000);



    const story =
        stories[currentStory][language];


    const difficultyNames =
        ["easy", "medium", "hard"];


    const level =
        difficultyNames[difficultyLevel];


    const question =
        story.questions[level][currentQuestion];


    /*
    Story information
    */

    document
        .getElementById("storyNumber")
        .innerText =
        "📖 Story " +
        (currentStory + 1) +
        " / " +
        stories.length;


    /*
    Overall question number.
    */

    const totalQuestion =
        (currentStory * 3) +
        currentQuestion +
        1;


    document
        .getElementById("questionNumber")
        .innerText =
        "Question " +
        totalQuestion +
        " / " +
        (stories.length * 3);


    /*
    Difficulty display
    */

    document
        .getElementById("difficultyText")
        .innerText =
        getDifficultyEmoji() +
        " " +
        getDifficultyName() +
        " Difficulty";


    /*
    Score
    */

    document
        .getElementById("scoreText")
        .innerText =
        "⭐ Score: " + score;


    /*
    Story
    */

    document
        .getElementById("storyTitle")
        .innerText =
        "📖 " + story.title;


    document
        .getElementById("storyText")
        .innerText =
        story.text;


    /*
    Question
    */

    document
        .getElementById("questionText")
        .innerText =
        question.question;


    /*
    Options
    */

    const options =
        document.getElementById("options");


    options.innerHTML = "";


    question.options.forEach(
        (option, index) => {

            const button =
                document.createElement("button");


            button.className =
                "option";


            button.innerText =
                option;


            button.onclick =
                () => checkAnswer(
                    index,
                    button
                );


            options.appendChild(button);

        }
    );


    document
        .getElementById("feedback")
        .innerText = "";


    document
        .getElementById("nextBtn")
        .classList.add("hidden");


    /*
    Progress bar
    */

    const completed =
        (currentStory * 3) +
        currentQuestion;


    const total =
        stories.length * 3;


    document
        .getElementById("progress")
        .style.width =
        (completed / total * 100) + "%";

}



/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(
    selected,
    button
) {

    clearInterval(timer);


    const difficultyNames =
        ["easy", "medium", "hard"];


    const level =
        difficultyNames[difficultyLevel];


    const story =
        stories[currentStory][language];


    const question =
        story.questions[level][currentQuestion];


    lockOptions();


    if (selected === question.answer) {

        button
            .classList
            .add("correct");


        /*
        Score based on difficulty.
        */

        if (difficultyLevel === 0) {

            score += 10;

        } else if (difficultyLevel === 1) {

            score += 20;

        } else {

            score += 30;

        }


        document
            .getElementById("feedback")
            .innerText =
            "✅ Correct! Difficulty increased!";


        /*
        CORRECT:
        Increase difficulty by 1 level.

        Easy → Medium
        Medium → Hard
        Hard → Hard
        */

        if (difficultyLevel < 2) {

            difficultyLevel++;

        }

    } else {

        button
            .classList
            .add("wrong");


        document
            .getElementById("feedback")
            .innerText =
            "❌ Incorrect! Next question will be easier.";


        /*
        WRONG:
        Decrease difficulty by 1 level.

        Hard → Medium
        Medium → Easy
        Easy → Easy
        */

        if (difficultyLevel > 0) {

            difficultyLevel--;

        }

    }


    document
        .getElementById("scoreText")
        .innerText =
        "⭐ Score: " + score;


    document
        .getElementById("nextBtn")
        .classList
        .remove("hidden");

}



/* =========================
   LOCK OPTIONS
========================= */

function lockOptions() {

    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach(button => {

        button.disabled = true;

        button.style.cursor =
            "default";

    });

}



/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    /*
    Move to next question
    within the same story.
    */

    currentQuestion++;


    /*
    After 3 questions,
    move to next story.
    */

    if (currentQuestion >= 3) {

        currentQuestion = 0;

        currentStory++;


        /*
        Every new story starts
        from Easy again.

        This keeps the game
        comfortable for the player.
        */

        difficultyLevel = 0;

    }


    /*
    All stories completed.
    */

    if (currentStory >= stories.length) {

        showResult();

    } else {

        showQuestion();

    }

}



/* =========================
   RESULT
========================= */

function showResult() {

    clearInterval(timer);


    document
        .getElementById("gameScreen")
        .classList
        .add("hidden");


    document
        .getElementById("resultScreen")
        .classList
        .remove("hidden");


    document
        .getElementById("finalScore")
        .innerText =
        score;

        fetch('http://localhost:5000/api/save_score', {
          method: 'POST',
           headers: {'Content-Type': 'application/json'},
           body: JSON.stringify({user_id: 1, game_type: 'story_detective', score: score, difficulty: getDifficultyName()})
                });


    let message = "";


    /*
    Maximum possible score:
    9 questions × 30 = 270
    */

    if (score >= 220) {

        message =
            "🌟 Excellent! Your memory and attention skills are very strong.";

    }

    else if (score >= 150) {

        message =
            "👏 Great job! You showed good memory and attention.";

    }

    else if (score >= 80) {

        message =
            "😊 Good attempt! Keep practicing your memory skills.";

    }

    else {

        message =
            "💪 Good effort! Try again and improve your score.";

    }


    document
        .getElementById("resultMessage")
        .innerText =
        message;


    /*
    Badge
    */

    if (score >= 220) {

        document
            .getElementById("badge")
            .innerText =
            "🏆 Memory Master";

    }

    else if (score >= 150) {

        document
            .getElementById("badge")
            .innerText =
            "🌟 Memory Champion";

    }

    else {

        document
            .getElementById("badge")
            .innerText =
            "🧠 Story Detective";

    }

}



/* =========================
   RESTART
========================= */

function restartGame() {

    clearInterval(timer);


    currentStory = 0;

    currentQuestion = 0;

    score = 0;

    difficultyLevel = 0;


    document
        .getElementById("resultScreen")
        .classList
        .add("hidden");


    document
        .getElementById("homeScreen")
        .classList
        .remove("hidden");

}
