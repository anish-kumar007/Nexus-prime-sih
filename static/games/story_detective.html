
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive Story Detective</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f8;
    color: #222;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 25px;
}

h1 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 10px;
}

h2 {
    font-size: 30px;
}

h3 {
    font-size: 25px;
}

p, li {
    font-size: 21px;
    line-height: 1.7;
}

.card {
    background: white;
    padding: 25px;
    margin: 20px 0;
    border-radius: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

.language-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin: 20px 0;
}

button {
    font-size: 20px;
    padding: 14px 22px;
    border: 2px solid #333;
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    min-width: 130px;
}

button:hover {
    background: #e9f2ff;
}

button.selected {
    background: #333;
    color: white;
}

button:focus-visible {
    outline: 4px solid #ff9800;
    outline-offset: 3px;
}

.option {
    display: block;
    width: 100%;
    margin: 12px 0;
    text-align: left;
    font-size: 21px;
}

.option.correct {
    background: #c8f7c5;
    border-color: #198754;
}

.option.wrong {
    background: #ffd6d6;
    border-color: #dc3545;
}

#feedback {
    font-weight: bold;
    font-size: 22px;
    margin-top: 20px;
}

.correct-text {
    color: #087f23;
}

.wrong-text {
    color: #b00020;
}

#timer {
    font-size: 25px;
    font-weight: bold;
    text-align: center;
    margin: 15px;
}

#score {
    font-size: 23px;
    font-weight: bold;
    text-align: center;
}

#difficulty {
    font-size: 23px;
    font-weight: bold;
    text-align: center;
}

#nextBtn,
#startBtn,
#restartBtn {
    display: block;
    margin: 20px auto;
    background: #222;
    color: white;
}

.hidden {
    display: none;
}

.story {
    background: #fffdf0;
    border-left: 7px solid #555;
    padding: 20px;
    border-radius: 10px;
}

.progress {
    font-size: 20px;
    text-align: center;
    margin: 10px;
}

@media (max-width: 600px) {
    .container {
        padding: 12px;
    }

    h1 {
        font-size: 30px;
    }

    h2 {
        font-size: 25px;
    }

    p, li, button {
        font-size: 18px;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🕵️ Story Detective</h1>

<div id="startScreen" class="card">

    <h2 id="welcomeTitle">Choose Your Language</h2>

    <div class="language-buttons">

        <button id="englishBtn"
                onclick="selectLanguage('english')"
                aria-label="Select English">
            English
        </button>

        <button id="hindiBtn"
                onclick="selectLanguage('hindi')"
                aria-label="Select Hindi">
            हिंदी
        </button>

        <button id="bengaliBtn"
                onclick="selectLanguage('bengali')"
                aria-label="Select Bengali">
            বাংলা
        </button>

        <button id="assameseBtn"
                onclick="selectLanguage('assamese')"
                aria-label="Select Assamese">
            অসমীয়া
        </button>

    </div>

    <button id="startBtn" onclick="startGame()">
        Start Game
    </button>

</div>


<div id="gameScreen" class="hidden">

    <div class="card">

        <div id="progress" class="progress"></div>

        <div id="difficulty"></div>

        <div id="score"></div>

        <div id="timer" aria-live="assertive"></div>

    </div>


    <div class="card">

        <h2 id="storyTitle"></h2>

        <div id="storyText" class="story"></div>

    </div>


    <div class="card">

        <h3 id="question"></h3>

        <div id="options"></div>

        <div id="feedback" aria-live="polite"></div>

        <button id="nextBtn"
                class="hidden"
                onclick="nextQuestion()">
            Next
        </button>

    </div>

</div>


<div id="endScreen" class="card hidden">

    <h2 id="finalTitle"></h2>

    <p id="finalScore"></p>

    <button id="restartBtn" onclick="restartGame()">
        Play Again
    </button>

</div>

</div>

/* =========================
   LANGUAGE SELECTION
========================= */

function selectLanguage(lang) {

    language = lang;

    const buttons = [
        "englishBtn",
        "hindiBtn",
        "bengaliBtn",
        "assameseBtn"
    ];

    buttons.forEach(id => {
        document.getElementById(id).classList.remove("selected");
    });

    document.getElementById(lang + "Btn").classList.add("selected");

    document.documentElement.lang =
        lang === "hindi" ? "hi" :
        lang === "bengali" ? "bn" :
        lang === "assamese" ? "as" :
        "en";

    updateStaticText();
}


/* =========================
   STATIC TEXT
========================= */

function updateStaticText() {

    const t = translations[language];

    document.getElementById("startBtn").textContent = t.start;
    document.getElementById("nextBtn").textContent = t.next;
    document.getElementById("restartBtn").textContent = t.playAgain;

}


/* =========================
   START GAME
========================= */

function startGame() {

    currentStory = 0;
    currentQuestion = 0;

    score = 0;

    difficulty = 0;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("endScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");

    loadQuestion();
}


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion() {

    clearInterval(timer);

    questionAnswered = false;

    const t = translations[language];

    const story = t.stories[currentStory];

    const question = story.questions[currentQuestion];

    document.getElementById("storyTitle").textContent =
        story.title;

    document.getElementById("storyText").textContent =
        story.text;

    document.getElementById("question").textContent =
        question.q;

    document.getElementById("progress").textContent =
        `${t.story} ${currentStory + 1}/3 — ${t.question} ${currentQuestion + 1}/3`;

    document.getElementById("difficulty").textContent =
        `${t.medium === "मध्यम" ? "कठिनाई" : "Difficulty"}: ${getDifficultyName()}`;

    document.getElementById("score").textContent =
        `${t.score}: ${score}`;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").classList.add("hidden");

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    question.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.className = "option";

        button.textContent = option;

        button.setAttribute(
            "aria-label",
            `Option ${index + 1}: ${option}`
        );

        button.onclick = () =>
            checkAnswer(index);

        optionsContainer.appendChild(button);

    });

    startTimer();

}


/* =========================
   DIFFICULTY
========================= */

function getDifficultyName() {

    const t = translations[language];

    if (difficulty === 0) return t.easy;
    if (difficulty === 1) return t.medium;

    return t.hard;
}


/* =========================
   TIMER
========================= */

function startTimer() {

    timeLeft = timeLimits[difficulty];

    updateTimer();

    timer = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

            clearInterval(timer);

            handleTimeout();

        }

    }, 1000);

}


function updateTimer() {

    const t = translations[language];

    document.getElementById("timer").textContent =
        `${t.time}: ${timeLeft}s`;

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(selectedIndex) {

    if (questionAnswered) return;

    questionAnswered = true;

    clearInterval(timer);

    const t = translations[language];

    const question =
        translations[language]
        .stories[currentStory]
        .questions[currentQuestion];

    const optionButtons =
        document.querySelectorAll(".option");

    optionButtons.forEach(button => {
        button.disabled = true;
    });

    if (selectedIndex === question.answer) {

        optionButtons[selectedIndex]
            .classList.add("correct");

        score += points[difficulty];

        document.getElementById("feedback").innerHTML =
            `<span class="correct-text">
            ${t.correct}<br>
            +${points[difficulty]} ${t.score}
            </span>`;

        /*
          Correct answer:
          Increase difficulty for next question,
          but never above Hard.
        */

        if (difficulty < 2) {
            difficulty++;
        }

    } else {

        optionButtons[selectedIndex]
            .classList.add("wrong");

        optionButtons[question.answer]
            .classList.add("correct");

        /*
          Wrong answer:
          Decrease difficulty for next question,
          but never below Easy.
        */

        if (difficulty > 0) {
            difficulty--;
        }

        document.getElementById("feedback").innerHTML =
            `<span class="wrong-text">
            ${t.wrong}<br>
            ${t.correctAnswer}
            <strong>${question.options[question.answer]}</strong>
            <br>
            ${t.nextDifficulty} ${getDifficultyName()}
            </span>`;
    }

    document.getElementById("score").textContent =
        `${t.score}: ${score}`;

    document.getElementById("nextBtn")
        .classList.remove("hidden");

}


/* =========================
   TIMEOUT
========================= */

function handleTimeout() {

    if (questionAnswered) return;

    questionAnswered = true;

    const t = translations[language];

    const question =
        translations[language]
        .stories[currentStory]
        .questions[currentQuestion];

    const optionButtons =
        document.querySelectorAll(".option");

    optionButtons.forEach(button => {
        button.disabled = true;
    });

    optionButtons[question.answer]
        .classList.add("correct");

    /*
      Timeout is treated as incorrect.
      Difficulty decreases.
    */

    if (difficulty > 0) {
        difficulty--;
    }

    document.getElementById("feedback").innerHTML =
        `<span class="wrong-text">
        ${t.timeout}<br>
        ${t.correctAnswer}
        <strong>${question.options[question.answer]}</strong>
        <br>
        ${t.nextDifficulty} ${getDifficultyName()}
        </span>`;

    document.getElementById("nextBtn")
        .classList.remove("hidden");

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    currentQuestion++;

    /*
      Three questions in one story.
    */

    if (currentQuestion >= 3) {

        currentStory++;

        currentQuestion = 0;

        /*
          Every new story starts from Easy.
        */

        difficulty = 0;

    }

    /*
      All three stories completed.
    */

    if (currentStory >= 3) {

        endGame();

        return;
    }

    loadQuestion();

}


/* =========================
   END GAME
========================= */

function endGame() {

    clearInterval(timer);

    const t = translations[language];

    document.getElementById("gameScreen")
        .classList.add("hidden");

    document.getElementById("endScreen")
        .classList.remove("hidden");

    document.getElementById("finalTitle")
        .textContent = t.finished;

    document.getElementById("finalScore")
        .textContent =
        `${t.yourScore} ${score}`;

        // Save the score for the currently registered Manova patient.
        // Fall back to demo patient 1 if no profile has been registered yet.
        const userId = Number(localStorage.getItem("manovaUserId")) || 1;

        fetch('/api/save_score', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: userId,
                game_type: 'story_detective',
                score: score,
                difficulty: difficultyNames[difficulty]
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('Story Detective score saved:', data);
        })
        .catch(err => {
            console.error('Story Detective score save failed:', err);
        });

}


/* =========================
   RESTART
========================= */

function restartGame() {

    currentStory = 0;
    currentQuestion = 0;

    score = 0;
    difficulty = 0;

    document.getElementById("endScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    loadQuestion();

}


/* Default language */

selectLanguage("english");
