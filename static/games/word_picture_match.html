<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Word Picture Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8f9fc);
            color: #222;
        }

        .container {
            max-width: 950px;
            margin: auto;
            padding: 25px;
        }

        .game-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        /* ---------------- HOME ---------------- */

        #homeScreen {
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 38px;
            margin: 5px 0 10px;
        }

        .description {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .language-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .languages {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 600px;
            margin: auto;
        }

        .language-btn {
            padding: 18px;
            border: 2px solid #dce2ec;
            background: #f8faff;
            border-radius: 15px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .language-btn:hover {
            transform: translateY(-3px);
            background: #edf3ff;
        }

        /* ---------------- GAME ---------------- */

        #gameScreen,
        #resultScreen {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .home-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: #eeeeee;
            cursor: pointer;
            font-size: 15px;
        }

        .score {
            font-weight: bold;
            font-size: 18px;
        }

        .level {
            padding: 9px 18px;
            border-radius: 20px;
            background: #edf1f7;
            font-weight: bold;
        }

        .progress-container {
            height: 10px;
            width: 100%;
            background: #e5e8ee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #333;
            transition: 0.4s;
        }

        .question-count {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .picture-box {
            max-width: 560px;
            margin: auto;
        }

        .picture {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }

        .question {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin: 22px 0;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .option {
            min-height: 65px;
            border: 2px solid #dfe4ec;
            border-radius: 15px;
            background: #fafbfe;
            font-size: 19px;
            cursor: pointer;
            padding: 14px;
            transition: 0.2s;
        }

        .option:hover {
            background: #edf2f8;
            transform: translateY(-2px);
        }

        .option.correct {
            background: #d8f3df;
            border-color: #39964e;
        }

        .option.wrong {
            background: #ffe0e0;
            border-color: #d64b4b;
        }

        .option:disabled {
            cursor: default;
            transform: none;
        }

        .feedback {
            min-height: 30px;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            margin: 18px 0;
        }

        .next-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        /* ---------------- RESULT ---------------- */

        #resultScreen {
            text-align: center;
        }

        .result-icon {
            font-size: 55px;
        }

        .final-score {
            font-size: 55px;
            font-weight: bold;
            margin: 20px;
        }

        .level-results {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .result-box {
            padding: 20px;
            border-radius: 15px;
            background: #f1f4f8;
        }

        .result-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .restart-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 650px) {

            .game-card {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

            .languages,
            .options {
                grid-template-columns: 1fr;
            }

            .level-results {
                grid-template-columns: 1fr;
            }

            .picture {
                height: 240px;
            }

            .top-bar {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

/* =====================================================
   GAME VARIABLES
===================================================== */

let currentLanguage = "en";

let currentQuestion = 0;

let score = 0;


/* =====================================================
   START GAME
===================================================== */

function startGame(language) {

    currentLanguage = language;

    currentQuestion = 0;

    score = 0;


    document.getElementById("homeScreen")
        .style.display = "none";

    document.getElementById("resultScreen")
        .style.display = "none";

    document.getElementById("gameScreen")
        .style.display = "block";


    loadQuestion();
}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    const q = questions[currentQuestion];

    const t = text[currentLanguage];


    /* Question number */

    document.getElementById("questionCount")
        .textContent =
        `${t.question} ${currentQuestion + 1} / 12`;


    /* Score */

    document.getElementById("scoreText")
        .textContent =
        `${t.score}: ${score}`;


    /* Level */

    document.getElementById("levelText")
        .textContent =
        getLevelName(q.level);


    /* Progress */

    document.getElementById("progressBar")
        .style.width =
        ((currentQuestion) / 12 * 100) + "%";


    /* Image */

    const image =
        document.getElementById("questionImage");

    image.src = q.image;

    image.alt =
        q.options[currentLanguage][q.correct];


    /* Question */

    document.getElementById("questionText")
        .textContent =
        t.what;


    /* Clear feedback */

    document.getElementById("feedback")
        .textContent = "";


    /* Hide next */

    document.getElementById("nextButton")
        .style.display = "none";


    document.getElementById("nextButton")
        .textContent = t.next;


    createOptions(q);
}


/* =====================================================
   GET LEVEL NAME
===================================================== */

function getLevelName(level) {

    return text[currentLanguage][level];

}


/* =====================================================
   CREATE OPTIONS
===================================================== */

function createOptions(question) {

    const container =
        document.getElementById("optionsContainer");

    container.innerHTML = "";


    /*
       Store option text + original position.
       Then shuffle the options.
    */

    const options =
        question.options[currentLanguage]
        .map(function(option, index) {

            return {
                text: option,
                index: index
            };

        });


    options.sort(function() {

        return Math.random() - 0.5;

    });


    options.forEach(function(option) {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            option.text;


        button.onclick = function() {

            checkAnswer(
                option.index,
                button
            );

        };


        container.appendChild(button);

    });

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
    selectedIndex,
    selectedButton
) {

    const q = questions[currentQuestion];

    const t = text[currentLanguage];


    const buttons =
        document.querySelectorAll(".option");


    /* Prevent multiple clicks */

    buttons.forEach(function(button) {

        button.disabled = true;

    });


    /* Correct */

    if (selectedIndex === q.correct) {

        score++;

        selectedButton.classList.add("correct");

        document.getElementById("feedback")
            .textContent =
            t.correct;

    }


    /* Wrong */

    else {

        selectedButton.classList.add("wrong");


        /*
           Highlight correct option
        */

        buttons.forEach(function(button) {

            if (
                button.textContent ===
                q.options[currentLanguage][q.correct]
            ) {

                button.classList.add("correct");

            }

        });


        document.getElementById("feedback")
            .textContent =
            t.wrong;

    }


    /* Show next */

    document.getElementById("nextButton")
        .style.display = "block";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion >= questions.length) {

        showResult();

        return;

    }


    loadQuestion();

}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

    document.getElementById("gameScreen")
        .style.display = "none";

    document.getElementById("resultScreen")
        .style.display = "block";


    const t = text[currentLanguage];


    document.getElementById("resultTitle")
        .textContent =
        t.complete;


    document.getElementById("resultMessage")
        .textContent =
        t.final;


    document.getElementById("finalScore")
        .textContent =
        `${score} / 12`;


    /*
       Since there are exactly
       4 questions per level:

       Q1-Q4 = Easy
       Q5-Q8 = Medium
       Q9-Q12 = Hard
    */

    let easyScore = 0;

    let mediumScore = 0;

    let hardScore = 0;


    /*
       We need to calculate level scores
       from user's answers.

       For this version, score tracking is
       done using answerHistory.
    */

    easyScore = answerHistory
        .filter(a => a.level === "easy" && a.correct)
        .length;

    mediumScore = answerHistory
        .filter(a => a.level === "medium" && a.correct)
        .length;

    hardScore = answerHistory
        .filter(a => a.level === "hard" && a.correct)
        .length;


    document.getElementById("easyResultTitle")
        .textContent = t.easy;

    document.getElementById("mediumResultTitle")
        .textContent = t.medium;

    document.getElementById("hardResultTitle")
        .textContent = t.hard;


    document.getElementById("easyResult")
        .textContent =
        `${easyScore} / 4`;

    document.getElementById("mediumResult")
        .textContent =
        `${mediumScore} / 4`;

    document.getElementById("hardResult")
        .textContent =
        `${hardScore} / 4`;

}


/* =====================================================
   ANSWER HISTORY
===================================================== */

let answerHistory = [];


/*
   Override checkAnswer to also store
   level-wise performance.
*/

const originalCheckAnswer = checkAnswer;


/*
   We replace the function with a wrapper.
*/

checkAnswer = function(
    selectedIndex,
    selectedButton
) {

    const q = questions[currentQuestion];

    const isCorrect =
        selectedIndex === q.correct;


    answerHistory.push({

        level: q.level,

        correct: isCorrect

    });


    originalCheckAnswer(
        selectedIndex,
        selectedButton
    );

};


/* =====================================================
   HOME
===================================================== */

function goHome() {

    document.getElementById("gameScreen")
        .style.display = "none";

    document.getElementById("resultScreen")
        .style.display = "none";

    document.getElementById("homeScreen")
        .style.display = "block";


    /*
       Reset answer history
    */

    answerHistory = [];

}

</script>
