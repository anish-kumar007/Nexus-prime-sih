<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/static/manifest.json">
<meta charset="UTF-8">
<title>Word Picture Match</title>
<style>


        /* GAME CARDS */

        .game-card {
            background: #eef4fb;
            padding: 25px;
            margin: 20px 0;
            border-radius: 20px;
        }

        .game-card button {
            width: 100%;
            min-height: 80px;
            margin: 10px 0;
            border: 2px solid #315c8c;
            border-radius: 15px;
            background: white;
            font-size: 26px;
        }

        .game-card button:hover {
            background: #d9ecff;
        }

        .picture {
            font-size: 100px;
            text-align: center;
            margin: 20px;
        }

        .feedback {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            min-height: 45px;
            margin: 15px;
        }

        .score {
            font-size: 25px;
            font-weight: bold;
            text-align: center;
        }

        /* GENERAL BUTTON */

        .back-btn {
            margin-top: 25px;
            padding: 18px 28px;
            font-size: 24px;
            border: none;
            border-radius: 15px;
            background: #315c8c;
            color: white;
        }

        .voice-btn {
            background: #6947a8;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 18px 25px;
            font-size: 24px;
            display: block;
            margin: 15px auto;
        }


</style>
</head>
<body>

    <section id="wordGame" class="screen">

        <h2>🍎 Word–Picture Match</h2>

        <div class="score">
            Score: <span id="gameScore">0</span>
        </div>

        <div class="game-card">

            <p style="text-align:center">
                Which picture matches:
            </p>

            <h2 id="wordQuestion"
                style="text-align:center">
                APPLE
            </h2>

            <div class="picture" id="gamePicture">
                🍎
            </div>

            <div id="answers">

                <button onclick="answer('APPLE')">
                    APPLE
                </button>

                <button onclick="answer('HOUSE')">
                    HOUSE
                </button>

                <button onclick="answer('TREE')">
                    TREE
                </button>

            </div>

            <div
                id="feedback"
                class="feedback">
            </div>

            <button
                class="voice-btn"
                onclick="voiceAnswer()">
                🎙️ Speak Answer
            </button>

        </div>

        <button
            class="back-btn"
            onclick="showScreen('games')">
            ← Back to Games
        </button>

    </section>

<button class="back-btn" onclick="window.location.href='../home.html'">← Back Home</button>
<script>

    
    let currentQuestion = 0;

    const questions = [

        {
            word: "APPLE",
            picture: "🍎",
            answers: ["APPLE", "HOUSE", "TREE"],
            correct: "APPLE"
        },

        {
            word: "HOUSE",
            picture: "🏠",
            answers: ["TREE", "HOUSE", "APPLE"],
            correct: "HOUSE"
        },

        {
            word: "TREE",
            picture: "🌳",
            answers: ["APPLE", "TREE", "HOUSE"],
            correct: "TREE"
        }

    ];

    function startGame() {

        currentQuestion = 0;

        showScreen("wordGame");

        displayQuestion();
    }


    function displayQuestion() {

        const q = questions[currentQuestion];

        document.getElementById(
            "wordQuestion"
        ).textContent = q.word;

        document.getElementById(
            "gamePicture"
        ).textContent = q.picture;

        const answers =
            document.getElementById("answers");

        answers.innerHTML = "";

        q.answers.forEach(answerText => {

            const button =
                document.createElement("button");

            button.textContent = answerText;

            button.onclick = () =>
                answer(answerText);

            answers.appendChild(button);

        });

        document.getElementById(
            "feedback"
        ).textContent = "";
    }


    function answer(selectedAnswer) {

        document.querySelectorAll("#answers button").forEach(b => b.disabled = true);

        const q = questions[currentQuestion];

        const feedback =
            document.getElementById("feedback");

        if (selectedAnswer === q.correct) {

            score++;

            feedback.textContent =
                "✓ Correct! Well done!";

        } else {

            feedback.textContent =
                "✗ Not quite. Try the next one!";
        }

        localStorage.setItem(
            "smritiScore",
            score
        );

        setTimeout(() => {

            currentQuestion++;

            if (currentQuestion >= questions.length) {

                gamesPlayed++;

                localStorage.setItem(
                    "smritiGamesPlayed",
                    gamesPlayed
                );

                fetch('http://localhost:5000/api/save_score', {
                      method: 'POST',
                      headers: {'Content-Type': 'application/json'},
                         body: JSON.stringify({user_id: 1, game_type: 'word_picture_match', score: score, difficulty: 'Easy'})
                        });

                feedback.textContent =
                    "🎉 Game complete!";

                setTimeout(() => {
                    showScreen("progress");
                }, 1200);

            } else {

                displayQuestion();

            }

        }, 900);

        document.getElementById(
            "gameScore"
        ).textContent = score;
    }


    /* =========================
       VOICE ANSWER
    ========================= */

    function voiceAnswer() {

        if (!("webkitSpeechRecognition" in window) &&
            !("SpeechRecognition" in window)) {

            alert(
                "Voice recognition is not supported in this browser."
            );

            return;
        }

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        const recognition =
            new SpeechRecognition();

        recognition.lang = "en-IN";

        recognition.start();

        recognition.onresult = function(event) {

            const spoken =
                event.results[0][0].transcript
                .toUpperCase();

            const q =
                questions[currentQuestion];

            let matchedAnswer = null;

            q.answers.forEach(answer => {

                if (spoken.includes(answer)) {
                    matchedAnswer = answer;
                }

            });

            if (matchedAnswer) {

                answer(matchedAnswer);

            } else {

                document.getElementById(
                    "feedback"
                ).textContent =
                    "I didn't understand. Please try again.";

                speak(
                    "I didn't understand. Please try again."
                );
            }
        };
    }

    /* =========================
       TEXT TO SPEECH
    ========================= */

    function speak(text) {

        if (!("speechSynthesis" in window)) {
            return;
        }

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang = "en-IN";

        utterance.rate = 0.9;

        window.speechSynthesis.speak(
            utterance
        );
    }


</script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/static/sw.js'); }</script>
</body>
</html>
